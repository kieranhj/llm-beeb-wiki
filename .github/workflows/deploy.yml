name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "quartz/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Quartz uses git log for last-modified dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # On Linux runner the Windows junction quartz/content -> wiki is a
      # broken directory entry. Quartz also doesn't follow symlinks for
      # content fetch, so we copy wiki/ into quartz/content/ for the build.
      - name: Stage wiki content for Quartz
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          cp -a wiki/. quartz/content/
          echo "Top-level entries:"; ls quartz/content
          echo ""
          echo "Markdown count: $(find quartz/content -name '*.md' | wc -l)"
          echo "index.md present: $(test -f quartz/content/index.md && echo yes || echo NO)"

      - name: Install Quartz dependencies + build
        run: |
          cd quartz
          npm ci
          npx quartz build --verbose

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
